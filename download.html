<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>分電盤しらべる君をダウンロード</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f2;color:#192b3c;font:16px/1.8 system-ui,sans-serif;padding:24px}main{width:min(100%,580px);padding:36px;background:white;border:1px solid #dce5ec;border-radius:20px}h1{font-size:25px;margin:0 0 16px}p{margin:12px 0}.button{display:block;text-align:center;background:#176656;color:white;padding:14px;border-radius:10px;text-decoration:none;font-weight:700;margin:24px 0}small{display:block;color:#526879}a{color:#176656}
</style>
</head>
<body>
<main>
<h1>分電盤しらべる君をダウンロード</h1>
<p id="status" role="status" aria-live="polite">ダウンロードする場合は、下のボタンを押してください。確認画面で「OK」を選ぶと保存を開始します。</p>
<a id="download" class="button" href="./index.html" download="分電盤しらべる君.html">HTMLをダウンロード</a>
<p>保存した <strong>分電盤しらべる君.html</strong> をブラウザで開いてご利用ください。</p>
<small>HTMLファイル1つで、インターネット接続なしで遊べます。回答や得点を外部送信しません。授業用モデルであり、生徒だけで実物を操作しないでください。</small><p><a href="./index.html#license" id="licenseLink">ライセンス・免責事項</a></p>

<p><a href="./index.html">ブラウザでそのまま使う</a></p>
</main>
<script>
const link=document.getElementById('download');
async function prepare(){
 const response=await fetch('./index.html',{cache:'no-store'});
 if(!response.ok) throw new Error('download failed');
 return URL.createObjectURL(new Blob([await response.text()],{type:'text/html;charset=utf-8'}));
}
async function save(){
 try{
  const url=await prepare();
  const a=document.createElement('a');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  a.href=url;a.download='分電盤しらべる君.html';
  document.body.appendChild(a);a.click();a.remove();
 }catch(error){
  document.getElementById('status').textContent='ダウンロードできませんでした。通信状態を確認し、下のボタンでもう一度お試しください。';
 }
}
link.addEventListener('click', event => {
 event.preventDefault();
 if (!window.confirm('「分電盤しらべる君.html」をダウンロードしますか？')) return;
 save();
});
</script>
</body>
</html>
